<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="glow-primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bg-grad); }
    .pulse-orb-1 {
      animation: pulse1 6s ease-in-out infinite alternate;
    }
    .pulse-orb-2 {
      animation: pulse2 8s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: flow 20s linear infinite;
    }
    .floating-pill {
      animation: float 4s ease-in-out infinite alternate;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    @keyframes pulse1 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      100% { transform: scale(1.2) translate(-20px, 15px); opacity: 0.7; }
    }
    @keyframes pulse2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      100% { transform: scale(1.3) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Base -->
  <rect class="bg" width="900" height="260" rx="16" />

  <!-- Animated Glowing Orbs (Background Layer) -->
  <circle class="pulse-orb-1" cx="150" cy="80" r="140" fill="#4f46e5" filter="url(#glow)" opacity="0.5" />
  <circle class="pulse-orb-2" cx="750" cy="180" r="130" fill="#c084fc" filter="url(#glow)" opacity="0.4" />
  <circle cx="450" cy="130" r="90" fill="#0284c7" filter="url(#glow)" opacity="0.25" />

  <!-- Dynamic Translation Flow Wave Lines (Background Layer) -->
  <path class="flow-line" d="M -50 200 Q 200 80 450 180 T 950 100" fill="none" stroke="url(#glow-primary)" stroke-width="2.5" opacity="0.6" />
  <path class="flow-line" d="M -50 70 Q 250 220 500 100 T 950 200" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Grid Dots Background Pattern -->
  <g opacity="0.15" fill="#ffffff">
    <circle cx="50" cy="40" r="1.5" /><circle cx="100" cy="40" r="1.5" /><circle cx="150" cy="40" r="1.5" /><circle cx="200" cy="40" r="1.5" />
    <circle cx="700" cy="40" r="1.5" /><circle cx="750" cy="40" r="1.5" /><circle cx="800" cy="40" r="1.5" /><circle cx="850" cy="40" r="1.5" />
    <circle cx="50" cy="220" r="1.5" /><circle cx="100" cy="220" r="1.5" /><circle cx="150" cy="220" r="1.5" /><circle cx="200" cy="220" r="1.5" />
    <circle cx="700" cy="220" r="1.5" /><circle cx="750" cy="220" r="1.5" /><circle cx="800" cy="220" r="1.5" /><circle cx="850" cy="220" r="1.5" />
  </g>

  <!-- Foreground Content Group (Always Sharp & Unobscured) -->
  <g transform="translate(45, 0)">
    <!-- Decorative Icon / Symbol -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#glow-primary)" />
      <path d="M 14 18 L 24 32 L 34 18 M 20 23 L 28 23 M 16 14 H 32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Main Title -->
    <text x="64" y="84" class="title-text">Awesome Neural Machine Translation</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">Curated Ecosystem of Enterprise SaaS Platforms, Self-Hosted NMT Engines &amp; Localization Tools</text>

    <!-- Interactive Badges/Pills Row in Lower Banner Area -->
    <g transform="translate(0, 160)">
      <!-- Pill 1: SaaS APIs -->
      <g class="floating-pill" transform="translate(0, 0)">
        <rect width="165" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#38bdf8" />
        <text x="34" y="22" class="tag-text">⚡ Cloud SaaS APIs</text>
      </g>

      <!-- Pill 2: Open-Source Models -->
      <g class="floating-pill" transform="translate(180, 0)" style="animation-delay: 0.6s;">
        <rect width="195" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#a855f7" />
        <text x="34" y="22" class="tag-text">🧠 Open-Source Engines</text>
      </g>

      <!-- Pill 3: Self-Hosted & Local -->
      <g class="floating-pill" transform="translate(390, 0)" style="animation-delay: 1.2s;">
        <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#22c55e" />
        <text x="34" y="22" class="tag-text">🔒 Self-Hosted Privacy</text>
      </g>

      <!-- Pill 4: Localization & TMS -->
      <g class="floating-pill" transform="translate(585, 0)" style="animation-delay: 1.8s;">
        <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="17" r="5" fill="#ec4899" />
        <text x="34" y="22" class="tag-text">🌐 Localization Platforms</text>
      </g>
    </g>
  </g>
</svg>
